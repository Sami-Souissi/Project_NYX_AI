[project]
name = "project-nyx-ai"
version = "0.1.0"
description = "NYX AI - An AI assistant for Docker and shell command automation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.30.0",
    "langchain>=0.1.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[project.scripts]
nyx-ai = "nyx_ai.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nyx_ai"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
